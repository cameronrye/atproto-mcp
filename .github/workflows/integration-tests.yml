name: Integration Tests

on:
  # These tests hit the live Bluesky network and self-document as occasionally
  # flaky (rate limiting / transient network). They are intentionally NOT run on
  # push/PR — a Bluesky hiccup must not red an unrelated change. Hermetic unit
  # tests cover PRs (see ci.yml); live coverage runs on a schedule / on demand.
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode to run'
        required: true
        default: 'unauthenticated'
        type: choice
        options:
          - unauthenticated
          - authenticated
          - all

# Least privilege: both jobs only check out code, run tests against the live
# network, and upload artifacts. No GITHUB_TOKEN writes anywhere.
permissions:
  contents: read

jobs:
  # Unauthenticated integration tests (public endpoints only)
  unauthenticated-tests:
    name: Unauthenticated Integration Tests
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.test_mode == 'unauthenticated' ||
      github.event.inputs.test_mode == 'all'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        # Pinned to a commit SHA; version read from package.json packageManager.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unauthenticated integration tests
        run: pnpm run test:integration
        env:
          RUN_INTEGRATION_TESTS: 'true'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unauthenticated-test-results
          path: |
            coverage/
            test-results/

  # Authenticated integration tests (requires test account)
  authenticated-tests:
    name: Authenticated Integration Tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (github.event.inputs.test_mode == 'authenticated' || github.event.inputs.test_mode == 'all' || github.event_name == 'schedule')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        # Pinned to a commit SHA; version read from package.json packageManager.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify test credentials are configured
        # Without this guard, missing secrets yield an empty .env.test, the test
        # runner skips every authenticated test, and the scheduled run goes green
        # without exercising credentials — its entire reason to exist. Fail loudly.
        env:
          BSKY_TEST_HANDLE: ${{ secrets.BSKY_TEST_HANDLE }}
          BSKY_TEST_PASSWORD: ${{ secrets.BSKY_TEST_PASSWORD }}
        run: |
          if [ -z "$BSKY_TEST_HANDLE" ] || [ -z "$BSKY_TEST_PASSWORD" ]; then
            echo "::error::BSKY_TEST_HANDLE and/or BSKY_TEST_PASSWORD secrets are not configured. Authenticated integration tests cannot run — configure both repository secrets."
            echo "❌ **Authenticated integration tests failed**: \`BSKY_TEST_HANDLE\` / \`BSKY_TEST_PASSWORD\` secrets are missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Test credentials are configured."

      - name: Create .env.test
        run: |
          cat > .env.test << EOF
          RUN_INTEGRATION_TESTS=true
          ATPROTO_TEST_IDENTIFIER=${{ secrets.BSKY_TEST_HANDLE }}
          ATPROTO_TEST_PASSWORD=${{ secrets.BSKY_TEST_PASSWORD }}
          ATPROTO_TEST_SERVICE=https://bsky.social
          TEST_RATE_LIMIT_DELAY=3000
          TEST_REQUEST_TIMEOUT=60000
          TEST_CLEANUP_ENABLED=true
          TEST_MAX_POSTS_PER_RUN=5
          TEST_MAX_FOLLOWS_PER_RUN=3
          TEST_MAX_LIKES_PER_RUN=5
          EOF

      - name: Run authenticated integration tests
        run: pnpm run test:integration:auth
        env:
          CI: 'true'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authenticated-test-results
          path: |
            coverage/
            test-results/

