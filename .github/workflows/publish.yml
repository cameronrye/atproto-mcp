name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0, 1.0.0-beta.1)'
        required: true
        type: string
      tag:
        description: 'npm tag (latest, beta, alpha, next)'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - beta
          - alpha
          - next
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Update package.json version
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          echo "Updated package.json to version ${{ inputs.version }}"

      - name: Verify package contents
        run: |
          echo "Package contents:"
          npm pack --dry-run

      - name: Dry run publish
        if: inputs.dry_run
        run: |
          echo "🔍 DRY RUN: Would publish version ${{ inputs.version }} with tag ${{ inputs.tag }}"
          pnpm publish --dry-run --tag ${{ inputs.tag }} --no-git-checks --provenance
          echo "✅ Dry run completed successfully"

      - name: Publish to npm
        if: '!inputs.dry_run'
        run: |
          echo "📦 Publishing version ${{ inputs.version }} with tag ${{ inputs.tag }}"
          pnpm publish --tag ${{ inputs.tag }} --no-git-checks --provenance --access public
          echo "✅ Published successfully"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        if: '!inputs.dry_run && inputs.tag == ''latest'''
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        if: '!inputs.dry_run && inputs.tag == ''latest'''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          body: |
            ## AT Protocol MCP Server ${{ inputs.version }}

            Published to npm: https://www.npmjs.com/package/atproto-mcp/v/${{ inputs.version }}

            ### Installation
            ```bash
            npm install -g atproto-mcp@${{ inputs.version }}
            ```

            ### Quick Start
            ```bash
            atproto-mcp
            ```

            For more information, see the [documentation](https://cameronrye.github.io/atproto-mcp).
          draft: false
          prerelease: false
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🔍 **Dry Run Completed**" >> $GITHUB_STEP_SUMMARY
            echo "Would have published version ${{ inputs.version }} with tag ${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Published Successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "- **npm tag**: ${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
            echo "- **npm Package**: https://www.npmjs.com/package/atproto-mcp/v/${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
            if [ "${{ inputs.tag }}" = "latest" ]; then
              echo "- **GitHub Release**: https://github.com/cameronrye/atproto-mcp/releases/tag/v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
            fi
          fi
