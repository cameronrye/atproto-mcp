name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0, 1.0.0-beta.1)'
        required: true
        type: string
      tag:
        description: 'npm tag (latest, beta, alpha, next)'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - beta
          - alpha
          - next
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout code
        # Pinned to a commit SHA — this workflow holds id-token:write / OIDC
        # publish authority, so every action is pinned (not a mutable tag).
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Use the workflow's GITHUB_TOKEN for git operations. It is always
          # valid and has contents:write (declared above), which is all this
          # job needs to push the tag and create the release. (A stale
          # RELEASE_TOKEN PAT previously broke checkout with an auth failure.)
          token: ${{ github.token }}
          # Full history + tags: the changelog step diffs against the previous
          # tag via `git describe --tags HEAD^`. With the default shallow clone
          # neither HEAD^ nor any tag exists, so every release degraded to
          # "- Initial release". fetch-depth: 0 also fetches refs/tags/*.
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to a commit SHA (this workflow holds id-token:write / OIDC publish
        # authority — pin every action). Version comes from packageManager.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        # Pinned to a commit SHA (OIDC publish authority — pin every action).
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # npm trusted publishing (OIDC) requires Node >= 22.14.0 and npm >= 11.5.1.
          # NOTE: intentionally NO `registry-url`. setup-node only writes an .npmrc
          # auth line + exports a dummy NODE_AUTH_TOKEN (XXXXX-XXXXX-...) when
          # registry-url is set; that placeholder masks OIDC failures as opaque
          # E404s. (The fix that drops the dummy, actions/setup-node#1558, is not in
          # any release yet.) Without registry-url there is no token to interfere,
          # and `npm publish` defaults to registry.npmjs.org where OIDC + automatic
          # provenance run on a clean slate.
          node-version: 22
          cache: 'pnpm'

      - name: Upgrade npm for trusted publishing
        # The Node 22 runner ships npm 10.x; OIDC trusted publishing needs >= 11.5.1.
        # We publish the final tarball with `npm publish` (pnpm has no native OIDC
        # support — its publish just shells out to npm), so npm itself must be recent.
        # Pinned to the 11.x major (not @latest): this job holds OIDC publish
        # authority, so it must not auto-adopt a future npm major sight unseen.
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Update package.json version
        run: |
          # --allow-same-version: the documented release flow commits the version
          # bump to main first, so package.json may already be at inputs.version;
          # without this flag `npm version` aborts with "Version not changed".
          npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
          echo "Updated package.json to version ${{ inputs.version }}"

      - name: Verify package contents
        run: |
          echo "Package contents:"
          npm pack --dry-run

      - name: Dry run publish
        if: inputs.dry_run
        run: |
          echo "🔍 DRY RUN: Would publish version ${{ inputs.version }} with tag ${{ inputs.tag }}"
          npm publish --dry-run --tag ${{ inputs.tag }} --access public
          echo "✅ Dry run completed successfully"

      - name: Publish to npm
        if: '!inputs.dry_run'
        # Authenticated via OIDC trusted publishing — no NODE_AUTH_TOKEN/NPM_TOKEN.
        # Requires the `id-token: write` permission above AND a trusted publisher
        # configured on npmjs.com for this repo + workflow file (publish.yml).
        # Provenance is generated automatically under trusted publishing, so the
        # --provenance flag is no longer needed.
        run: |
          echo "📦 Publishing version ${{ inputs.version }} with tag ${{ inputs.tag }}"
          npm publish --tag ${{ inputs.tag }} --access public
          echo "✅ Published successfully"

      - name: Create git tag
        if: '!inputs.dry_run && inputs.tag == ''latest'''
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Generate changelog
        if: '!inputs.dry_run && inputs.tag == ''latest'''
        id: changelog
        run: |
          # Generate changelog from git commits since last tag
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          if git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD^)
            echo "Changes since $LAST_TAG:" >> $GITHUB_OUTPUT
            # `git log --pretty=format:` emits no trailing newline; without one
            # the closing EOF delimiter glues to the last line and the output
            # file command fails ("Matching delimiter not found").
            git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          else
            echo "- Initial release" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: '!inputs.dry_run && inputs.tag == ''latest'''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          body: |
            ## AT Protocol MCP Server ${{ inputs.version }}

            ### Changes
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Installation
            ```bash
            npm install -g atproto-mcp@${{ inputs.version }}
            ```

            ### Quick Start
            ```bash
            # Start in unauthenticated mode (works immediately!)
            atproto-mcp
            ```

            For more information, see the [documentation](https://cameronrye.github.io/atproto-mcp).
          draft: false
          prerelease: false
          # No `files:` — the npm registry is the canonical artifact. Uploading the
          # raw dist/ tree as release assets fails because GitHub flattens asset
          # names and dist has colliding basenames (index.d.ts/index.js in several
          # subdirs), which 404s the upload and reds the whole publish run.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🔍 **Dry Run Completed**" >> $GITHUB_STEP_SUMMARY
            echo "Would have published version ${{ inputs.version }} with tag ${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Published Successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "- **npm tag**: ${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
            echo "- **npm Package**: https://www.npmjs.com/package/atproto-mcp/v/${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
            if [ "${{ inputs.tag }}" = "latest" ]; then
              echo "- **GitHub Release**: https://github.com/cameronrye/atproto-mcp/releases/tag/v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
            fi
          fi
