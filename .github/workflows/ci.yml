name: CI

# This workflow runs unit tests, linting, and builds
# For integration tests, see .github/workflows/integration-tests.yml

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: every job only checks out code and runs local tooling.
# Codecov authenticates with CODECOV_TOKEN, not the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        # Pinned to a commit SHA (supply-chain hardening); version is read from
        # the `packageManager` field in package.json, so no `version:` input.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Type check (tests)
        # Test files are excluded from the production tsconfig, so without this
        # step stale imports/types in tests only surface at runtime.
        run: pnpm run type-check:tests

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      - name: Security audit (production dependencies)
        # Gate on vulnerabilities in shipped/runtime dependencies only. Dev-only
        # tooling chains (vitest, vitepress, eslint, etc.) are not published and
        # would otherwise make this noisy.
        run: pnpm audit --prod --audit-level=high

      - name: Run tests
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == 20
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    # Branch protection on main requires the "Build" status check, so this job
    # stays even though the test job also builds. It uploads no artifacts —
    # nothing consumed them; npm is the canonical artifact (see publish.yml).
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
