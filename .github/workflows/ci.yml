name: CI

# This workflow runs unit tests, linting, and builds
# For integration tests, see .github/workflows/integration-tests.yml

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: every job only checks out code and runs local tooling.
# Codecov authenticates with CODECOV_TOKEN, not the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        # Pinned to a commit SHA (supply-chain hardening); version is read from
        # the `packageManager` field in package.json, so no `version:` input.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Type check (tests)
        # Test files are excluded from the production tsconfig, so without this
        # step stale imports/types in tests only surface at runtime.
        run: pnpm run type-check:tests

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      - name: Security audit (production dependencies)
        # Gate on vulnerabilities in shipped/runtime dependencies only. Dev-only
        # tooling chains (vitest, vitepress, eslint, etc.) are not published and
        # would otherwise make this noisy.
        # package.json `pnpm.auditConfig.ignoreGhsas` waives GHSA-mrhx-c7xc-m3w5
        # (zod <4.6.6 array-issue memory exhaustion) for the zod 3 copy pulled in
        # by @atproto/api, which has no zod 4 release yet. That copy only parses
        # bundled lexicon docs and single blob-ref/nux objects — no unbounded
        # arrays from untrusted input. Our own zod is floored at ^4.6.7. Drop the
        # waiver once @atproto/api moves to zod 4.
        run: pnpm audit --prod --audit-level=high

      - name: Run tests
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == 20
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    # Branch protection on main requires the "Build" status check, so this job
    # stays even though the test job also builds. It uploads no artifacts —
    # nothing consumed them; npm is the canonical artifact (see publish.yml).
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
