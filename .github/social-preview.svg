<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    
    <!-- Hexagon gradient -->
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <!-- @ symbol gradient -->
    <linearGradient id="atGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Text shadow -->
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGradient)"/>
  
  <!-- Decorative grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#60a5fa" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#60a5fa" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#60a5fa" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#60a5fa" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#60a5fa" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#60a5fa" stroke-width="1"/>
  </g>
  
  <!-- Logo (centered at top) -->
  <g transform="translate(490, 40) scale(1.2)">
    <!-- Hexagon background -->
    <path d="M 100 10 L 173.2 55 L 173.2 145 L 100 190 L 26.8 145 L 26.8 55 Z"
          fill="url(#hexGradient)"
          stroke="#60a5fa"
          stroke-width="2"/>

    <!-- Network nodes -->
    <circle cx="70" cy="70" r="4" fill="#60a5fa" opacity="0.8"/>
    <circle cx="130" cy="70" r="4" fill="#60a5fa" opacity="0.8"/>
    <circle cx="70" cy="130" r="4" fill="#60a5fa" opacity="0.8"/>
    <circle cx="130" cy="130" r="4" fill="#60a5fa" opacity="0.8"/>

    <!-- Connection lines -->
    <line x1="70" y1="70" x2="100" y2="100" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
    <line x1="130" y1="70" x2="100" y2="100" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
    <line x1="70" y1="130" x2="100" y2="100" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
    <line x1="130" y1="130" x2="100" y2="100" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>

    <!-- @ symbol -->
    <g filter="url(#glow)">
      <circle cx="100" cy="100" r="35" fill="none" stroke="url(#atGradient)" stroke-width="8"/>
      <circle cx="100" cy="100" r="15" fill="none" stroke="url(#atGradient)" stroke-width="6"/>
      <path d="M 135 100 L 135 115 Q 135 125 125 125 Q 115 125 115 115"
            fill="none"
            stroke="url(#atGradient)"
            stroke-width="8"
            stroke-linecap="round"/>
    </g>

    <!-- Decorative corner accents -->
    <circle cx="50" cy="50" r="3" fill="#60a5fa" opacity="0.5"/>
    <circle cx="150" cy="50" r="3" fill="#60a5fa" opacity="0.5"/>
    <circle cx="50" cy="150" r="3" fill="#60a5fa" opacity="0.5"/>
    <circle cx="150" cy="150" r="3" fill="#60a5fa" opacity="0.5"/>
  </g>

  <!-- Text content (centered) -->
  <g filter="url(#textShadow)">
    <!-- Main title -->
    <text x="640" y="360" font-family="Arial, sans-serif" font-size="68" font-weight="bold" fill="#ffffff" text-anchor="middle">
      AT Protocol MCP Server
    </text>

    <!-- Subtitle -->
    <text x="640" y="420" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle">
      MCP server for AT Protocol integration
    </text>

    <!-- Feature badges (centered as a group) -->
    <g>
      <!-- Calculate center: total width = 130+15+95+15+110+15+120 = 500, start at (1280-500)/2 = 390 -->
      <!-- Badge 1: TypeScript -->
      <rect x="390" y="470" width="130" height="42" rx="21" fill="#3b82f6" opacity="0.9"/>
      <text x="455" y="497" font-family="Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">TypeScript</text>

      <!-- Badge 2: MCP -->
      <rect x="535" y="470" width="95" height="42" rx="21" fill="#8b5cf6" opacity="0.9"/>
      <text x="582.5" y="497" font-family="Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">MCP</text>

      <!-- Badge 3: Bluesky -->
      <rect x="645" y="470" width="110" height="42" rx="21" fill="#0ea5e9" opacity="0.9"/>
      <text x="700" y="497" font-family="Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">Bluesky</text>

      <!-- Badge 4: Real-time -->
      <rect x="770" y="470" width="120" height="42" rx="21" fill="#10b981" opacity="0.9"/>
      <text x="830" y="497" font-family="Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">Real-time</text>
    </g>

    <!-- Footer text -->
    <text x="640" y="560" font-family="Arial, sans-serif" font-size="24" fill="#64748b" text-anchor="middle">
      57 Tools • OAuth Support • Streaming • Analytics
    </text>

    <!-- GitHub link -->
    <text x="640" y="605" font-family="monospace" font-size="22" fill="#60a5fa" text-anchor="middle">
      github.com/cameronrye/atproto-mcp
    </text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="1150" cy="100" r="60" fill="#3b82f6" opacity="0.1"/>
  <circle cx="1200" cy="540" r="80" fill="#8b5cf6" opacity="0.1"/>
  <circle cx="100" cy="540" r="40" fill="#0ea5e9" opacity="0.1"/>
</svg>

